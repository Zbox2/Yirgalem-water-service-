<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Customer Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Inter', sans-serif; }
    .table-container { max-height:60vh; overflow-y:auto; }
    .table-container::-webkit-scrollbar { width:8px; }
    .table-container::-webkit-scrollbar-thumb { background:#888; border-radius:4px; }
    .table-container::-webkit-scrollbar-thumb:hover { background:#555; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <div class="container mx-auto p-4 md:p-8 max-w-5xl">
    <header class="flex justify-between items-center mb-8">
      <div class="text-center flex-1">
        <h1 class="text-4xl font-bold text-gray-900">Yirgalem Water and Sewerage Service Portal</h1>
        <p class="text-gray-600 mt-2">Search customer</p>
      </div>
      <button id="logoutBtn" class="ml-4 bg-red-600 text-white font-semibold py-2 px-5 rounded-lg hover:bg-red-700 transition duration-200">
        Logout
      </button>
    </header>

    <!-- Search Form -->
    <div class="card bg-white rounded-xl shadow-lg mb-6">
      <div class="card-header bg-indigo-600 text-white p-4 rounded-t-xl">
        <h2 class="text-xl font-semibold">Search Customers</h2>
      </div>
      <div class="card-body p-6">
        <form id="searchForm">
          <div class="flex flex-col sm:flex-row gap-3">
            <input type="text" id="searchInput" class="flex-grow w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-200 disabled:bg-gray-200"
              placeholder="Loading data, please wait..." required disabled>
            <button id="searchButton" class="w-full sm:w-auto bg-indigo-600 text-white font-semibold py-3 px-6 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition duration-200 disabled:bg-indigo-300 disabled:cursor-not-allowed" type="submit" disabled>
              Search
            </button>
          </div>
          <p class="text-sm text-gray-500 mt-3">Search is case-insensitive. You can enter part of a name.</p>
        </form>
      </div>
    </div>

    <div id="resultsContainer" class="hidden"></div>
  </div>

  <footer class="mt-8 text-center text-gray-500 pb-6">
    <p id="footerText">Customer Search System | No data loaded.</p>
  </footer>

  <script>
    // ✅ Session check
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "login.html";
    }

    document.addEventListener('DOMContentLoaded', function() {
      // Logout button clears session
      document.getElementById('logoutBtn').addEventListener('click', function() {
        localStorage.removeItem("loggedIn");
        window.location.href = "login.html";
      });
    });

    // --- HARDCODED DATA SOURCE ---
    const EXCEL_FILE_URL = 'customer_database.xlsx'; 
    let customers = [];
    let currentResults = [];

    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const searchButton = document.getElementById('searchButton');
    const resultsContainer = document.getElementById('resultsContainer');
    const footerText = document.getElementById('footerText');

    searchForm.addEventListener('submit', function(event) {
      event.preventDefault();
      const searchTerm = searchInput.value.trim().toLowerCase();
      if (!searchTerm) { clearResults(); return; }
      const filteredCustomers = customers.filter(customer =>
        Object.values(customer).some(value =>
          String(value).toLowerCase().includes(searchTerm)
        )
      );
      currentResults = filteredCustomers;
      displayResults(filteredCustomers, searchTerm);
    });

    async function loadFileFromUrl(url) {
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Network response was not ok: ${response.statusText}`);
        const data = await response.arrayBuffer();
        const workbook = XLSX.read(data, {type:'array'});
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(worksheet);
        if (jsonData.length === 0) throw new Error("Excel file is empty or invalid.");
        customers = jsonData;
        searchInput.disabled = false;
        searchButton.disabled = false;
        searchInput.placeholder = 'Enter customer name, email, or other details';
        footerText.textContent = `Customer Search System | Data loaded from: ${url}`;
        clearResults();
      } catch (error) {
        console.error("Error:", error);
        searchInput.placeholder = 'File load failed. Check console.';
        footerText.textContent = "Error: Could not load data.";
      }
    }

    function displayResults(results, searchTerm) {
      resultsContainer.innerHTML = '';
      resultsContainer.classList.remove('hidden');
      if (results.length === 0) {
        resultsContainer.innerHTML = `
          <div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 rounded-lg shadow-md">
            <p class="font-bold">No Results</p>
            <p>No customers found matching "${escapeHTML(searchTerm)}".</p>
          </div>`;
        return;
      }
      const headers = Object.keys(results[0]);
      const tableHeaders = headers.map(h => `<th class="p-3 text-left text-sm font-semibold text-gray-200 uppercase">${escapeHTML(h)}</th>`).join('');
      const tableRows = results.map(row => {
        const cells = headers.map(h => `<td class="p-3 text-sm text-gray-700">${escapeHTML(row[h])}</td>`).join('');
        return `<tr class="border-b border-gray-200 hover:bg-gray-100">${cells}</tr>`;
      }).join('');
      resultsContainer.innerHTML = `
        <div class="card bg-white rounded-xl shadow-lg">
          <div class="card-header bg-green-600 text-white p-4 flex justify-between items-center rounded-t-xl">
            <h3 class="text-lg font-semibold">Found ${results.length} match(es) for "${escapeHTML(searchTerm)}"</h3>
            <button id="exportButton" class="bg-white text-green-700 font-semibold py-2 px-4 rounded-lg hover:bg-green-100 transition text-sm">Export to CSV</button>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive table-container">
              <table class="w-full">
                <thead class="bg-gray-700 sticky top-0"><tr>${tableHeaders}</tr></thead>
                <tbody class="bg-white">${tableRows}</tbody>
              </table>
            </div>
          </div>
        </div>`;
      document.getElementById('exportButton').addEventListener('click', exportResultsToCsv);
    }

    function clearResults() {
      resultsContainer.innerHTML = '';
      resultsContainer.classList.add('hidden');
      currentResults = [];
    }

    function exportResultsToCsv() {
      if (currentResults.length === 0) { alert("No results to export."); return; }
      const headers = Object.keys(currentResults[0]);
      const csvRows = [headers.join(',')];
      currentResults.forEach(row => {
        const values = headers.map(h => `"${String(row[h] || '').replace(/"/g, '""')}"`);
        csvRows.push(values.join(','));
      });
      const blob = new Blob([csvRows.join('\n')], { type:'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "customer_search_results.csv";
      link.click();
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return str.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;')
                           .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
                           .replace(/'/g,'&#039;');
    }

    window.onload = () => loadFileFromUrl(EXCEL_FILE_URL);
  </script>
</body>
</html>
