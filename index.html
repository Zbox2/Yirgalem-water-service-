<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yirgalem Water Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 50%, #c7d2fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
        }
        .loading-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 3rem;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .water-icon {
            font-size: 4rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .spinner {
            border: 4px solid #e2e8f0;
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 1.5rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (prefers-color-scheme: dark) {
            body { background: linear-gradient(135deg, #0f172a, #1e293b); }
            .loading-card { background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255,255,255,0.05); }
            .loading-card h2 { color: #f1f5f9; }
            .loading-card p { color: #94a3b8; }
        }
    </style>
</head>
<body>
    <div class="loading-card">
        <div class="water-icon">
            <i class="fas fa-tint"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mt-3">Yirgalem Water Service</h2>
        <p class="text-gray-500 text-sm mt-1">Enterprise Management Portal</p>
        <div class="spinner"></div>
        <p class="text-gray-400 text-sm">Checking session...</p>
        <div class="mt-4 flex justify-center gap-3">
            <a href="login.html" class="text-blue-600 hover:text-blue-800 text-sm font-medium">
                <i class="fas fa-sign-in-alt mr-1"></i> Login
            </a>
            <span class="text-gray-300">|</span>
            <a href="home.html" class="text-green-600 hover:text-green-800 text-sm font-medium">
                <i class="fas fa-home mr-1"></i> Home
            </a>
        </div>
    </div>

    <script>
        (function() {
            // Check if user is already logged in
            const isLoggedIn = localStorage.getItem('loggedIn') === 'true';
            
            if (isLoggedIn) {
                // User is logged in - redirect to home after a brief delay
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 800);
            } else {
                // User is not logged in - redirect to login after a brief delay
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 800);
            }
        })();
    </script>
</body>
</html>
